<div class="auth-shell">
  <mat-card class="auth-card">
    <mat-card-header>
      <div mat-card-avatar class="auth-avatar">
        <mat-icon>spa</mat-icon>
      </div>
      <mat-card-title>Create your EasyGrow account</mat-card-title>
      <mat-card-subtitle>
        Sign up with your mobile number and password. You can enable passkeys and magic links later.
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="register()" [formGroup]="registrationForm" class="auth-form">
        <!-- Mobile -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Mobile number</mat-label>
          <input matInput id="mobile" name="mobile" type="tel" required placeholder="+91 98765 43210"
            formControlName="mobile" />
        </mat-form-field>

        <!-- Email -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email (optional)</mat-label>
          <input matInput id="email" name="email" type="email" placeholder="you@example.com" formControlName="email" />
        </mat-form-field>

        <!-- Password -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput id="password" name="password" type="password" required minlength="8"
            placeholder="At least 8 characters" formControlName="password" />
          <mat-icon matSuffix>lock</mat-icon>
        </mat-form-field>

        <!-- Confirm password -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirm password</mat-label>
          <input matInput id="confirmPassword" name="confirmPassword" type="password" required
            placeholder="Re-enter your password" formControlName="confirmPassword" />
          <mat-icon matSuffix>lock_reset</mat-icon>
        </mat-form-field>

        <!-- Role selection -->
        <!-- <div class="role-row">
          <span class="role-label">Account type</span>
          <mat-button-toggle-group
            name="accountType"
            [(ngModel)]="asOwner"
            class="role-toggle-group"
          >
            <mat-button-toggle [value]="true">Owner</mat-button-toggle>
            <mat-button-toggle [value]="false">Maintainer</mat-button-toggle>
          </mat-button-toggle-group>
        </div> -->

        <!-- OwnerId for maintainer -->
        <!-- @if (!asOwner) {
        <mat-form-field
          appearance="outline"
          class="full-width"
        >
          <mat-label>Owner ID</mat-label>
          <input
            matInput
            id="ownerId"
            name="ownerId"
            type="text"
            [(ngModel)]="ownerId"
            placeholder="Owner account ID"
          />
        </mat-form-field>
      } -->

        <!-- Primary action -->
        <button mat-raised-button color="primary" class="full-width primary-button" type="submit"
          [disabled]="!registrationForm.valid">
          Create account
        </button>

        <!-- Secondary actions -->
        @if (canUsePasskey) {
        <div class="secondary-actions">
          <button mat-stroked-button color="primary" class="full-width" type="button" (click)="enablePasskey()">
            <mat-icon>fingerprint</mat-icon>
            <span>Enable passkey on this device</span>
          </button>
        </div>
        }

        <!-- Message / errors -->
        @if (message) {
        <p class="auth-message">{{ message }}</p>
        }
      </form>
    </mat-card-content>

    <mat-card-actions align="end" class="auth-footer">
      <span>Already have an account?</span>
      <button mat-button color="primary" routerLink="/login">
        Sign in
      </button>
    </mat-card-actions>
  </mat-card>
</div>
