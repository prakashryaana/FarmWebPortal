<div class="parentrow">
<div class="childcol">
<form class="container" [formGroup]="farmRegistrationForm" (ngSubmit)="registerFarm()" class="farm-registration-form">

  <h2>Farm Registration</h2>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Farm Name</mat-label>
    <input matInput type="text" formControlName="farmName" required />
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Survey No.</mat-label>
    <input matInput type="text" formControlName="surveyNumber" required />
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Address</mat-label>
    <input matInput type="text" formControlName="address" required />
  </mat-form-field>

  <!-- Geo Tag input (optional) -->
  <!-- <mat-form-field appearance="fill" class="full-width">
    <mat-label>Geo Tag</mat-label>
    <input matInput type="text" formControlName="geoTag" />
  </mat-form-field> -->

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Shade-net Area (sq. mt)</mat-label>
    <input matInput type="number" formControlName="shadeNetArea" required />
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Farm Pond Volume (cu. mt)</mat-label>
    <input matInput type="number" formControlName="farmPondVolume" required />
  </mat-form-field>

  <label>Is Solar Power Available?</label>
  <mat-radio-group formControlName="isSolarPowerAvailable" class="radio-group">
    <mat-radio-button value="true">Yes</mat-radio-button>
    <mat-radio-button value="false">No</mat-radio-button>
  </mat-radio-group>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Motor Capacity</mat-label>
    <mat-select formControlName="motorCapacity" required>
      <mat-option value="" disabled>Select Motor Capacity</mat-option>
      <mat-option value="5.5 HP">5.5 HP</mat-option>
      <mat-option value="7.5 HP">7.5 HP</mat-option>
      <mat-option value="10 HP">10 HP</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Additional Water Source</mat-label>
    <input matInput type="text" formControlName="additionalWaterSource" />
  </mat-form-field>

  <!-- You can continue like this for other inputs in your form -->

  <div appearance="fill" class="full-width">
    <label for="Water-test-certificate">Upload Water Test Certificate</label>
    <app-file-upload id="Water-test-certificate" (fileUploaded)="handleFileUploaded($event)"></app-file-upload>
  </div>

  <mat-slide-toggle formControlName="isSinglePhasePower">Single Phase Power</mat-slide-toggle>
  <mat-slide-toggle formControlName="isThreePhasePower">Three Phase Power</mat-slide-toggle>

  <!-- <label>Is Single Phase Power?</label>
  <mat-radio-group formControlName="isSinglePhasePower" class="radio-group">
    <mat-radio-button value="true">Yes</mat-radio-button>
    <mat-radio-button value="false">No</mat-radio-button>
  </mat-radio-group>

  <label>Is Three Phase Power?</label>
  <mat-radio-group formControlName="isThreePhasePower" class="radio-group">
    <mat-radio-button value="true">Yes</mat-radio-button>
    <mat-radio-button value="false">No</mat-radio-button>
  </mat-radio-group> -->

  <!-- <mat-form-field appearance="fill" class="full-width">
    <mat-label>Grid Power Unavailability Time Slots</mat-label>
    <input matInput type="text" formControlName="gridPowerUnAvailability" placeholder="e.g., 2 PM - 4 PM, 6 PM - 8 PM" />
  </mat-form-field> -->

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Automation Room Size (sq. ft)</mat-label>
    <input matInput type="number" formControlName="automationRoomSize" required />
  </mat-form-field>

  <!-- <mat-form-field appearance="fill" class="full-width">
    <mat-label>Farmhouse Note</mat-label>
    <input matInput type="text" formControlName="farmhouseNote" />
  </mat-form-field> -->

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Storage Area Note</mat-label>
    <input matInput type="text" formControlName="storageAreaNote" required />
  </mat-form-field>

  <div style="margin-top: 1rem;">
    <button mat-raised-button color="primary" type="submit" [disabled]="farmRegistrationForm.invalid">
      Register
    </button>
    <button mat-button type="button" (click)="farmRegistrationForm.reset()">
      Reset
    </button>
  </div>

</form>
</div>
<div class="childcol2">
  <app-location></app-location>
</div>
</div>
