
<ng-container *ngIf="activities$ | async as activities; else loading">
    <p *ngIf="activities.length === 0">No activities recorded for this crop yet.</p>

    @if(activities.length > 0){
    <mat-list *ngIf="activities.length > 0">
        <mat-list-item *ngFor="let a of activities">
            <mat-icon matListIcon>{{ iconFor(a.activityType) }}</mat-icon>
            <div matLine>
                {{ a.activityId}}
                {{ a.cropId }}
                {{ a.activityType | titlecase }} •
                {{ a.createdAt | date:'short' }}
                {{ a.updatedAt | date:'short' }}
            </div>
            <div matLine>
                {{ a.message }}
            </div>
        </mat-list-item>
    </mat-list>
    }
</ng-container>


<ng-template #loading>
    <div class="loading">
        <mat-spinner diameter="32"></mat-spinner>
    </div>
</ng-template>
