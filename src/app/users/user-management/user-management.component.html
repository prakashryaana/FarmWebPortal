<div class="user-management">
      <mat-card>
        <mat-card-header>
          <mat-card-title>User Management</mat-card-title>
          <button mat-raised-button color="primary" (click)="openCreateDialog()">
            <mat-icon>add</mat-icon> Add User
          </button>
        </mat-card-header>
        
        

        @if (users(); as userList) {
          <table mat-table [dataSource]="userList" class="mat-elevation-z8">

            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef>Name</th>
              <td mat-cell *matCellDef="let user">{{ user.name }}</td>
            </ng-container>

            <ng-container matColumnDef="mobile">
              <th mat-header-cell *matHeaderCellDef>Mobile</th>
              <td mat-cell *matCellDef="let user">{{ user.mobile }}</td>
            </ng-container>
            
            <ng-container matColumnDef="email">
              <th mat-header-cell *matHeaderCellDef>Email</th>
              <td mat-cell *matCellDef="let user">{{ user.email }}</td>
            </ng-container>
            
            <ng-container matColumnDef="roles">
              <th mat-header-cell *matHeaderCellDef>Roles</th>
              <td mat-cell *matCellDef="let user">{{ user.roles }}</td>
            </ng-container>

            <ng-container matColumnDef="systemStatus">
              <th mat-header-cell *matHeaderCellDef>Status</th>
              <td mat-cell *matCellDef="let user"
                    [class.active-status]="user.systemStatus === 'ACTIVE'"
                    [class.inactive-status]="user.systemStatus !== 'ACTIVE'">
                    {{ user.systemStatus }}
                </td>
            </ng-container>
            
            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef>Actions</th>
              <td mat-cell *matCellDef="let user">
                <button mat-icon-button color="primary" (click)="editUser(user)">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="setTempPassword(user)">
                  <mat-icon>vpn_key</mat-icon>
                </button>
                <button mat-icon-button (click)="setSystemStatus(user)" matTooltip="{{user.systemStatus === 'ACTIVE' ? 'Deactivate?' : 'Activate?'}}">
                <mat-icon>{{ user.systemStatus === 'ACTIVE' ? 'thumb_down' : 'thumb_up' }}</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="deleteUser(user)">
                  <mat-icon>delete</mat-icon>
                </button>
              </td>
            </ng-container>
            
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        }
        @if (!users() && loading()) {
          <div class="loading">Loading users...</div>
        }  @else if (userRows().length === 0) {
            <div class="empty">No users found</div>
            }
        
      </mat-card>
      
      <!-- <mat-snack-bar-container></mat-snack-bar-container> -->
    </div>
