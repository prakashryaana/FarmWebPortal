<mat-card>
  <!-- <mat-card-title>Actions - {{selectedFarmName}} / {{selectedCropName}}</mat-card-title> -->
  <mat-card-content>
    <div class="actions-toolbar">
      <button mat-stroked-button color="primary" (click)="generateReport()"><mat-icon>description</mat-icon>{{'common.generateReport'|translate}}</button>
    </div>

    <mat-tab-group>
      <mat-tab [label]="'activity.viewActivities' | translate">
        <app-list-activity></app-list-activity>
      </mat-tab>
      <mat-tab [label]="'observation.viewObservations' | translate">
        <app-list-observation></app-list-observation>
      </mat-tab>
    </mat-tab-group>
  </mat-card-content>
</mat-card>
