<!-- src/app/components/activity-list/activity-list.component.html -->

<div *ngIf="loading" class="loading">
  <mat-progress-spinner diameter="36"></mat-progress-spinner>
</div>

<table mat-table [dataSource]="dataSource" *ngIf="!loading">

  <!-- Created At -->
  <ng-container matColumnDef="createdAt">
    <th mat-header-cell *matHeaderCellDef> Date </th>
    <td mat-cell *matCellDef="let a">
      {{ a.createdAt | date: 'short' }}
    </td>
  </ng-container>

  <!-- Activity Type -->
  <ng-container matColumnDef="activityType">
    <th mat-header-cell *matHeaderCellDef> Type </th>
    <td mat-cell *matCellDef="let a">
      {{ a.activityType }}
    </td>
  </ng-container>

  <!-- Message -->
  <ng-container matColumnDef="message">
    <th mat-header-cell *matHeaderCellDef> Message </th>
    <td mat-cell *matCellDef="let a">
      {{ a.message }}
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row        *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<p *ngIf="!loading && dataSource.data.length === 0">
  No activities recorded for the selected crop yet.
</p>
