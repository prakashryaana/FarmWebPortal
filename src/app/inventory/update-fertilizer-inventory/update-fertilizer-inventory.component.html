<div class="card">
  <h2>Fertilizer Inventory</h2>
  <form [formGroup]="fertilizerInventoryform">
    <input formControlName="id" type="hidden" />
    <label>Fertilizer Name</label>
    <input formControlName="fertilizerName" type="text" maxlength="100" />

    <label>Quantity Supplied</label>
    <input formControlName="quantitySupplied" type="number" step="0.01" />

    <label>Supplied Date</label>
    <input formControlName="suppliedDate" type="datetime-local" />

    <label>Quantity Used</label>
    <input formControlName="quantityUsed" type="number" step="0.01" />

    <label>Used Date</label>
    <input formControlName="usedDate" type="datetime-local" />

    <div class="actions">
      <button type="button" (click)="create()">Create</button>
      <button type="button" (click)="update()">Update</button>
      <button type="button" (click)="delete()">Delete</button>
    </div>
  </form>

  <h3>Existing</h3>
  <ul class="list">
    <li *ngFor="let i of list"><button (click)="select(i)">{{i.fertilizerName}} — {{i.quantitySupplied}}</button></li>
  </ul>
</div>
