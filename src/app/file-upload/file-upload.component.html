<div>

  <input type="file" color="primary" (change)="onFileSelected($event)" #fileInput>

  <button mat-raised-button color="accent" (click)="uploadFile()" [disabled]="!selectedFile">
    Upload
  </button>

  <mat-progress-bar *ngIf="progress > 0 && progress < 100" mode="determinate" [value]="progress">
  </mat-progress-bar>

  <div *ngIf="message" class="message" style="margin-top: 1rem;">
    {{ message }}
  </div>

</div>
